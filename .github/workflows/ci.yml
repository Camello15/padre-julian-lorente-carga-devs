name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, pruebas y SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube necesita el historial completo para atribuir cambios.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (backend y frontend)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas con cobertura
        run: npm run test:cobertura

      - name: Ajustar rutas de cobertura para SonarQube
        run: |
          sed -i 's#^SF:src/#SF:backend/src/#' backend/coverage/lcov.info
          sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/lcov.info

      - name: Análisis con SonarQube Cloud
        # Se omite hasta que se configure el secreto SONAR_TOKEN (ver README) y en PRs desde forks.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Aviso si falta SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN no está configurado; se omitió el análisis de SonarQube Cloud."

  docker:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen backend
        run: docker build -f backend/Dockerfile -t padre-julian-lorente-carga-devs-backend:${{ github.sha }} .

      - name: Build imagen frontend
        run: docker build -f frontend/Dockerfile -t padre-julian-lorente-carga-devs-frontend:${{ github.sha }} .
