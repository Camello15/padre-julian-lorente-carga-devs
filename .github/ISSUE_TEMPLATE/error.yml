name: Error
description: Algo no funciona como se espera
labels: []
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
  - type: input
    id: rol
    attributes:
      label: Rol con el que se probó
      placeholder: PMO, Técnico, Administrativo o Administrador TI
